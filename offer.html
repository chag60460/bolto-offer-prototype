<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create an offer · Bolto prototype</title>
  <link rel="stylesheet" href="styles.css">
  <script src="status-tags.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="error-announcer" class="sr-only" role="alert" aria-atomic="true"></div>
  <div id="toast" class="toast" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-heading"></dialog>
  <noscript>This interactive prototype needs JavaScript to move between screens. It does not send real offers.</noscript>
</body>
</html>
